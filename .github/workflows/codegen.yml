name: API Codegen

on:
  workflow_dispatch:
    inputs:
      api_spec_url:
        description: 'URL of the OpenAPI spec (e.g. https://api.takeoff.tn/v1/openapi.json)'
        required: false
        default: 'https://api.takeoff.tn/v1/openapi.json'

jobs:
  codegen:
    name: Regenerate TypeScript API client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

